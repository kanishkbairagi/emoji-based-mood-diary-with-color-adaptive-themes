version: '3.8'

services:
  # Relational Database: PostgreSQL 16 with automated schema provisioning
  postgres:
    image: postgres:16-alpine
    container_name: mood-vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mood_vault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mood-vault-network

  # In-Memory Cache & Sliding-Window Rate Limiter: Redis 7
  redis:
    image: redis:7-alpine
    container_name: mood-vault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mood-vault-network

  # Systems API Backend: Express + TypeScript Zero-Knowledge Vault
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mood-vault-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: dev-production-vault-key-minimum-32-bytes-secure
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mood_vault
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mood-vault-network

networks:
  mood-vault-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
