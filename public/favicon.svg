<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="vaultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle with Subtle Drop Shadow -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#vaultGradient)" />
  <rect x="4" y="4" width="56" height="28" rx="16" fill="url(#innerGlow)" />

  <!-- Stylized Affective Smile Arc (Continuous Valence) -->
